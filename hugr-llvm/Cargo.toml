[package]
name = "hugr-llvm"
version = "0.30.4"
description = "A general and extensible crate for lowering HUGRs into LLVM IR"

edition.workspace = true
rust-version.workspace = true

readme = "README.md"
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/hugr-llvm"
authors = ["TKET development team <tket-support@quantinuum.com>"]
keywords = ["Quantum", "Quantinuum"]
categories = ["compilers", "science::quantum-computing"]

[features]
test-utils = ["insta", "rstest", "portgraph", "rand"]

default = ["llvm21-1"]
llvm21-1 = ["inkwell/llvm21-1"]

[lints]
workspace = true

[dependencies]
inkwell = { version = ">=0.9.0, <0.11", default-features = false }
hugr-core = { path = "../hugr-core", version = "0.30.4" }
anyhow.workspace = true
itertools.workspace = true
delegate.workspace = true
petgraph.workspace = true
strum.workspace = true

insta = { workspace = true, optional = true }
rstest = { workspace = true, optional = true }
portgraph = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug"] }
rand = { workspace = true, optional = true }

[dev-dependencies]
hugr-llvm = { "path" = ".", features = ["test-utils"] }
serde_json.workspace = true

[build-dependencies]
cc = "1.2.63"
